apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: monitoring
  labels:
    io.cilium/loadbalancer-mode: "l2"
    app: uptime-kuma
  annotations:
    lbipam.cilium.io/ips: "192.168.1.124"
spec:
  type: LoadBalancer
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
  selector:
    app.kubernetes.io/name: uptime-kuma
