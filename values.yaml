storage:
  className: "nfs-fast-retain"
  accessMode: "ReadWriteMany"

prometheus:
  image:
    repository: prom/prometheus
    tag: "v2.52.0"
  retentionTime: "15d"
  storageSize: "10Gi"
  service:
    type: NodePort
    nodePort: 30090
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

alertmanager:
  enabled: true
  webhookUrl: "http://webhook-transformer.monitoring.svc:8080/webhook" # Or direct webhook endpoint

externalScrapes:
  enabled: true
  targets:
    - "192.168.1.28:9100" # Alpine NFS VM
    - "192.168.1.20:9100"  # Proxmox Host

grafana:
  image:
    repository: grafana/grafana
    tag: "10.4.2"
  adminUser: "admin"
  adminPassword: "adminPassword123!"
  storageSize: "5Gi"
  service:
    type: LoadBalancer
    loadBalancerIP: "192.168.1.126" # Dedicated secondary LAN IP for Grafana
    annotations:
      lbipam.cilium.io/ips: "192.168.1.126"
    labels:
      io.cilium/loadbalancer-mode: "l2"
    #type: NodePort
    #nodePort: 30300
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

nodeExporter:
  enabled: true
  image:
    repository: prom/node-exporter
    tag: "v1.8.0"

tracing:
  enabled: true
  tempo:
    storageSize: "5Gi"
    storageClassName: "nfs-fast-retain"
