apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-prometheus
spec:
  type: {{ .Values.prometheus.service.type | default "NodePort" }}
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      {{- if eq (.Values.prometheus.service.type | default "NodePort") "NodePort" }}
      nodePort: {{ .Values.prometheus.service.nodePort | default 30090 }}
      {{- end }}
  selector:
    app: {{ .Release.Name }}-prometheus
